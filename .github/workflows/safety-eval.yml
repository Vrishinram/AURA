name: AI Safety Regression Evaluation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  safety-evaluation:
    name: Model Safety & Regression Verification
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run Unit Test Suite
        run: |
          python -m pytest -v

      - name: Run Safety Regression Suite (CI Mock Benchmark)
        run: |
          aura-safety run --target mock --mock-mode strict_safe --output-dir data/runs

      - name: Upload Run Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: safety-evaluation-reports
          path: data/runs/
